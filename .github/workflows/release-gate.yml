name: HarnessAmp Release Gate

on:
  pull_request:
  push:
    branches:
      - master
      - main
      - codex/**
  workflow_dispatch:

jobs:
  release-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Run release gate
        run: |
          mkdir -p output/release-gate
          npm run release:gate -- examples/demo-bundle.json examples/cli/observed-runs.json --min-holdout-pass 15 --max-gap 60 --min-overall-score 55 --write-json output/release-gate/result.json --write-md output/release-gate/result.md

      - name: Upload release gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate
          path: output/release-gate
