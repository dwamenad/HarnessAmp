name: HarnessAmp Release Gate

on:
  pull_request:
  push:
    branches:
      - master
      - main
      - codex/**
  workflow_dispatch:

jobs:
  release-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Run HarnessAmp reusable action
        uses: ./
        with:
          bundle: examples/demo-bundle.json
          observations: examples/cli/observed-runs.json
          max-mutations: 3
          min-overall-score: 55
          min-holdout-pass: 15
          max-robustness-gap: 60
          output-dir: output/release-gate

      - name: Upload release gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate
          path: output/release-gate
